manifest_version = 1

[plugin]
name = "Hyprland Navigator"
version = "1.0.0"
description = "Workspace scrubbing, window movement, and focused-window layout actions"
license = "MIT OR Apache-2.0"
source = "github:cameroncooper/touchbar-hyprland"
api = "^1.0"

[runtime]
kind = "button-set-logic"
entrypoint = "component/plugin.wasm"
world = "touchbar:plugin/button-set-logic@1.0.0"

[[sets]]
id = "workspaces"
file = "sets/workspaces.toml"

[[sets]]
id = "window-actions"
file = "sets/window-actions.toml"

[[sets]]
id = "move-window"
file = "sets/move-window.toml"

[[permission]]
capability = "context.read.v1"
required = false
reason = "Adapt controls to the focused application and active workspace"
[permission.scope]
facts = ["application.id", "workspace.id"]
maximum_updates_per_second = 10

[[permission]]
capability = "command.run.v1"
required = false
reason = "Send narrowly templated dispatches to the running Hyprland session"
[permission.scope]
maximum_parallel_processes = 1

[[permission.scope.commands]]
id = "workspace"
executable = "/usr/bin/hyprctl"
arguments = [{ kind = "literal", value = "dispatch" }, { kind = "literal", value = "workspace" }, { kind = "bounded-integer", name = "workspace", minimum = 1, maximum = 10 }]
maximum_output_bytes = 4096
timeout_milliseconds = 1000

[[permission.scope.commands]]
id = "move-window"
executable = "/usr/bin/hyprctl"
arguments = [{ kind = "literal", value = "dispatch" }, { kind = "literal", value = "movetoworkspace" }, { kind = "bounded-integer", name = "workspace", minimum = 1, maximum = 10 }]
maximum_output_bytes = 4096
timeout_milliseconds = 1000

[[permission.scope.commands]]
id = "fullscreen"
executable = "/usr/bin/hyprctl"
arguments = [{ kind = "literal", value = "dispatch" }, { kind = "literal", value = "fullscreen" }, { kind = "literal", value = "1" }]
maximum_output_bytes = 4096
timeout_milliseconds = 1000

[[permission.scope.commands]]
id = "toggle-float"
executable = "/usr/bin/hyprctl"
arguments = [{ kind = "literal", value = "dispatch" }, { kind = "literal", value = "togglefloating" }]
maximum_output_bytes = 4096
timeout_milliseconds = 1000
