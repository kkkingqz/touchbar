manifest_version = 1

[plugin]
name = "Media"
version = "1.1.0"
description = "Now playing from MPRIS players: title, transport controls and a scrubbable timeline"
license = "MIT OR Apache-2.0"
source = "github:cameroncooper/touchbar-media"
api = "^1.0"

[runtime]
kind = "button-set-logic"
entrypoint = "component/plugin.wasm"
world = "touchbar:plugin/button-set-logic@1.0.0"

[[sets]]
id = "now-playing"
file = "sets/now-playing.toml"

[[sets]]
id = "transport"
file = "sets/transport.toml"

[[sets]]
id = "timeline"
file = "sets/timeline.toml"

[[sets]]
id = "touchbar-logo"
file = "sets/touchbar-logo.toml"

[[asset]]
id = "touchbar-wordmark"
path = "assets/touchbar.svg"
kind = "symbolic-svg"
width = 171
height = 40

[[asset]]
id = "play"
path = "assets/play.svg"
kind = "symbolic-svg"
width = 24
height = 24

[[asset]]
id = "pause"
path = "assets/pause.svg"
kind = "symbolic-svg"
width = 24
height = 24

[[asset]]
id = "backward"
path = "assets/backward.svg"
kind = "symbolic-svg"
width = 24
height = 24

[[asset]]
id = "forward"
path = "assets/forward.svg"
kind = "symbolic-svg"
width = 24
height = 24

[[asset]]
id = "note"
path = "assets/note.svg"
kind = "symbolic-svg"
width = 24
height = 24

[[permission]]
capability = "media.read.v1"
required = false
reason = "Show what the current player is playing and how far it is"
[permission.scope]
maximum_updates_per_second = 4

[[permission]]
capability = "media.control.v1"
required = false
reason = "Play, pause, skip and scrub the current player when you touch its controls"
[permission.scope]
actions = ["play-pause", "next", "previous", "seek"]
